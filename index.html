    <!-- Начальные состояния анимаций ставит только этот скрипт: без JS и при reduced-motion классов нет, всё видно. -->
    <script>
      (function (d) {
        var h = d.documentElement;
        var reduced =
          (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) ||
          /[?&]nomotion=1/.test(location.search);
        if (reduced) return;
        h.classList.add('js-anim');
        try {
          if (!sessionStorage.getItem('eleads-intro')) h.classList.add('js-preload');
        } catch (e) {}
        setTimeout(function () {
          if (!h.classList.contains('motion-ok')) h.classList.remove('js-anim');
          h.classList.remove('js-preload');
        }, 4000);
      })(document);
    </script>

            <ul class="hero__stats" data-hero-fade>

            <div class="hero__actions" data-hero-fade>

            <span class="lang-switch__thumb" aria-hidden="true"></span>
            <button type="button" class="lang-switch__btn" data-lang="ua" aria-pressed="true" data-i18n-attr="aria-label:common.langUaFull"><span data-i18n="common.langUa"></span></button>
            <button type="button" class="lang-switch__btn" data-lang="en" aria-pressed="false" data-i18n-attr="aria-label:common.langEnFull"><span data-i18n="common.langEn"></span></button>
          </div>
        </div>
      </div>

      <div class="footer__wordmark text-grad" aria-hidden="true" data-i18n="common.brand"></div>

      <div class="footer__bottom container">
        <p data-i18n="footer.copyright"></p>
        <p class="footer__credit">
          <span data-i18n="footer.creditLabel"></span>
          <a class="is-placeholder" href="#" data-placeholder data-i18n="footer.creditName"></a>
        </p>
        <button type="button" class="footer__top" data-scroll-top>
          <span data-i18n="footer.toTop"></span>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" /></svg>
        </button>
      </div>
    </footer>

    <noscript><style>.preloader{display:none!important}</style></noscript>
  </body>
</html>
